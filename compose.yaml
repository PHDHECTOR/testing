services:
  app:
    build: .
    image: rerimss-web:local
    restart: unless-stopped
    environment:
      RERIMSS_HOSTS: ${RERIMSS_DOMAIN:?Define RERIMSS_DOMAIN en .env}
      RERIMSS_PROXY_HOPS: "1"
    volumes:
      - accounts:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  nginx:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${RERIMSS_BIND_IP:-0.0.0.0}:${RERIMSS_HTTP_PORT:-80}:80"
      - "${RERIMSS_BIND_IP:-0.0.0.0}:${RERIMSS_HTTPS_PORT:-443}:443"
    environment:
      RERIMSS_DOMAIN: ${RERIMSS_DOMAIN:?Define RERIMSS_DOMAIN en .env}
      NGINX_ENVSUBST_FILTER: "^RERIMSS_DOMAIN$"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${RERIMSS_TLS_DIR:-./tls}:/etc/nginx/tls:ro
    security_opt:
      - no-new-privileges:true
volumes:
  accounts:
